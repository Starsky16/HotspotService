name: Build

# CI + 自动发版。两条构建线（net8 / net10）共用本文件，在各自分支上内容完全一致：
# 目标分支、.NET SDK 版本与 Release 的 Latest 标记全部从 HotspotService/manifest.yml
# 的 assetsRoot 推导（main_net8/HotspotService → 构建线 net8、目标分支 main_net8）。
#
# 步骤：构建 → 跑两个控制台测试工程 → 校验入库 cipx 与源码一致
#      → 非 tag 时顺带验证打包链路；推送 a.b.c.d tag 时用入库产物创建 Release。
on:
  push:
    branches: [dev_net8, main_net8, dev_net10, main_net10]
    # 只写 branches 时 tag 推送不会触发本工作流，必须显式声明 tags。
    tags:
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

# 创建 Release 需要写权限；本仓库默认工作流权限为 read，不显式声明会以 403 失败。
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成发布说明要按 tag 追溯历史提交，浅克隆拿不到标签与历史。
          fetch-depth: 0

      - name: 判定构建线
        id: line
        shell: pwsh
        run: |
          $manifest = Get-Content HotspotService/manifest.yml -Raw
          $assetsRoot = [regex]::Match($manifest, '(?m)^\s*assetsRoot:\s*(\S+)').Groups[1].Value
          if (-not $assetsRoot) { throw "未能从 HotspotService/manifest.yml 解析出 assetsRoot" }

          $branch = $assetsRoot.Split('/')[0]
          $line = $branch -replace '^main_', ''
          if ($line -notin @('net8', 'net10')) {
            throw "无法识别的构建线：$line（来自 assetsRoot=$assetsRoot）"
          }

          $version = [regex]::Match($manifest, '(?m)^\s*version:\s*(\S+)').Groups[1].Value
          $apiVersion = [regex]::Match($manifest, '(?m)^\s*apiVersion:\s*(\S+)').Groups[1].Value
          $tfm = [regex]::Match((Get-Content HotspotService/HotspotService.csproj -Raw), '<TargetFramework>([^<]+)</TargetFramework>').Groups[1].Value
          if (-not $tfm) { throw "未能从插件 csproj 解析出 TargetFramework" }
          $netMajor = [regex]::Match($tfm, '^net(\d+)\.').Groups[1].Value

          # net8 线标 Latest、net10 线不标：两条线长期并行，Latest 只给 net8。
          $latest = if ($line -eq 'net8') { 'true' } else { 'false' }

          @(
            "branch=$branch"
            "line=$line"
            "version=$version"
            "apiVersion=$apiVersion"
            "tfm=$tfm"
            "dotnet=$netMajor.x"
            "latest=$latest"
          ) | Add-Content -Path $env:GITHUB_OUTPUT

          Write-Host "构建线=$line 目标分支=$branch 版本=$version apiVersion=$apiVersion TFM=$tfm SDK=$netMajor.x Latest=$latest"

      - name: Install .NET ${{ steps.line.outputs.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.line.outputs.dotnet }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ steps.line.outputs.line }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ steps.line.outputs.line }}-
            ${{ runner.os }}-nuget-

      - name: Build plugin
        run: dotnet build .\HotspotService\HotspotService.csproj -c Release

      # 两个测试工程都是 OutputType=Exe 的控制台程序（手写断言），
      # dotnet test 不会执行任何用例，必须用 dotnet run 并检查退出码。
      - name: Run unit tests
        run: dotnet run --project .\HotspotService.Tests\HotspotService.Tests.csproj -c Release

      - name: Run behavior tests
        run: dotnet run --project .\HotspotService.BehaviorTests\HotspotService.BehaviorTests.csproj -c Release

      - name: 校验入库 cipx 与源码一致
        shell: pwsh
        run: |
          # HotspotService/cipx/ 下的 .cipx 与 checksums.md 是本仓库有意入库的产物，
          # 改了清单或代码就必须重新打包并一起提交，否则索引里的 MD5 会失效。
          #
          # 这里校验的是可确定复现的部分：zip 条目里的 HotspotService.dll / .pdb 会随
          # 编译环境变化（同一台机器重新打包也拿不到相同字节），因此不参与比对；
          # 其余资源文件是纯拷贝，逐字节可复现。
          $cipx = 'HotspotService\cipx\HotspotService.cipx'
          $sums = 'HotspotService\cipx\checksums.md'

          $hash = (Get-FileHash $cipx -Algorithm MD5).Hash
          $recorded = [regex]::Match((Get-Content $sums -Raw), '"HotspotService\.cipx"\s*:\s*"([0-9A-F]+)"').Groups[1].Value
          if (-not $recorded) { throw "checksums.md 中找不到 HotspotService.cipx 的 MD5 记录" }
          if ($hash -ne $recorded) {
            throw "cipx 实际 MD5（$hash）与 checksums.md 记录值（$recorded）不一致，二者必须同批更新"
          }
          Write-Host "✅ cipx 的 MD5 与 checksums.md 记录一致：$hash"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $extract = Join-Path $env:RUNNER_TEMP 'cipx-content'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path $cipx).Path, $extract)

          $diff = @()
          foreach ($name in @('manifest.yml', 'README.md', 'LICENSE', 'icon.png')) {
            $inZip = Join-Path $extract $name
            if (-not (Test-Path $inZip)) { $diff += "$name（cipx 内不存在）"; continue }
            $zipHash = (Get-FileHash $inZip -Algorithm SHA256).Hash
            $repoHash = (Get-FileHash "HotspotService\$name" -Algorithm SHA256).Hash
            if ($zipHash -ne $repoHash) { $diff += $name }
          }
          if ($diff.Count -gt 0) {
            throw "cipx 内的资源文件与仓库工作区不一致：$($diff -join '、')。改动清单 / 文档 / 图标后必须重新打包并提交 cipx 与 checksums.md。"
          }
          Write-Host "✅ cipx 内的 manifest.yml / README.md / LICENSE / icon.png 与工作区一致"

      # tag 推送时跳过：发布用的是入库产物，重新打包会把它覆盖掉。
      - name: 验证打包链路可用
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: dotnet publish .\HotspotService\HotspotService.csproj -c Release -p:CreateCipx=true -p:GenerateHashSummary=true

      - name: 生成发布说明
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $line = '${{ steps.line.outputs.line }}'
          $tfm = '${{ steps.line.outputs.tfm }}'
          $apiVersion = '${{ steps.line.outputs.apiVersion }}'
          $other = if ($line -eq 'net8') { 'net10' } else { 'net8' }
          $netMajor = [regex]::Match($tfm, '^net(\d+)\.').Groups[1].Value
          $md5 = (Get-FileHash 'HotspotService\cipx\HotspotService.cipx' -Algorithm MD5).Hash
          $repoUrl = "https://github.com/$env:GITHUB_REPOSITORY"

          # 两条线的 tag 序列是交替的（net8 取 .0、net10 取 .1），且分处不同分支，
          # 直接取全局最新 tag 会跨线比较出一大堆无关提交；这里按第四位筛出同线的上一个 tag。
          $suffix = if ($line -eq 'net8') { '0' } else { '1' }
          $prev = (git tag --sort=-v:refname |
            Where-Object { $_ -ne $tag -and $_ -match "^[0-9]+\.[0-9]+\.[0-9]+\.${suffix}$" } |
            Select-Object -First 1)
          Write-Host "同线上一个 tag：$prev"
          if ($prev) {
            $subjects = @(git log --pretty=format:'%s' "$prev..$tag")
            $changelog = "$repoUrl/compare/$prev...$tag"
          } else {
            $subjects = @(git log --pretty=format:'%s')
            $changelog = "$repoUrl/commits/$tag"
          }

          $groups = @{ feat = @(); fix = @(); other = @() }
          foreach ($subject in $subjects) {
            $text = ($subject -replace '^\w+(\([^)]*\))?!?:\s*', '').Trim()
            if ($subject -match '^feat') { $groups.feat += "- $text" }
            elseif ($subject -match '^fix') { $groups.fix += "- $text" }
            else { $groups.other += "- $text" }
          }

          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("<!-- CLASSISLAND_PKG_MD5 {`"HotspotService.cipx`":`"$md5`"} -->")
          $lines.Add("")
          $lines.Add("本版本为 **$line 构建线**：目标框架 ``$tfm``，apiVersion ``$apiVersion``，适用于 .NET $netMajor 版 ClassIsland。另一条构建线为 $other。")
          $lines.Add("")
          $lines.Add("本仓库是 [Alan-CRL/HotspotService](https://github.com/Alan-CRL/HotspotService) 的 fork。")
          foreach ($title in @('新增', '修复', '其它')) {
            $key = if ($title -eq '新增') { 'feat' } elseif ($title -eq '修复') { 'fix' } else { 'other' }
            if ($groups[$key].Count -gt 0) {
              $lines.Add("")
              $lines.Add("### $title")
              $lines.AddRange([string[]]$groups[$key])
            }
          }
          $lines.Add("")
          $lines.Add("**Full Changelog**: $changelog")

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesPath -Value ($lines -join "`n") -Encoding utf8
          "notes=$notesPath" | Add-Content -Path $env:GITHUB_OUTPUT
          Write-Host "发布说明已生成：$notesPath"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $latestArg = if ('${{ steps.line.outputs.latest }}' -eq 'true') { '--latest' } else { '--latest=false' }

          # 必须显式 --target：不指定时 Release 会落到仓库默认分支（main_net8），
          # 历史上的 0.3.1.1（net10）正是因此被错误地指向了 main_net8。
          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --target '${{ steps.line.outputs.branch }}' `
            --title "$tag (${{ steps.line.outputs.line }})" `
            $latestArg `
            --notes-file '${{ steps.notes.outputs.notes }}' `
            'HotspotService\cipx\HotspotService.cipx' `
            'HotspotService\cipx\checksums.md'

          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,targetCommitish,isLatest,assets --jq '"已发布: \(.tagName) → \(.targetCommitish)  Latest=\(.isLatest)", (.assets[] | "  附件 \(.name) \(.size) 字节")'